<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVMC Road Watch - Commissioner Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --accent: #E8842C;
            --background: #F8FAFC;
            --on-surface: #1E293B;
            --border-radius: 0.375rem;
            --font-noto: 'Noto Sans', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-noto);
            background-color: var(--background);
            color: var(--on-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            width: 440px;
            max-width: 92%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header {
            background: #0F172A;
            color: #FFFFFF;
            padding: 28px;
            text-align: center;
        }

        .header-emblem {
            width: 48px;
            height: 48px;
            border: 2px solid #E8842C;
            border-radius: 6px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: #E8842C;
        }

        .card-body {
            padding: 28px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .btn-submit {
            width: 100%;
            background: #0F172A;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #1E293B;
        }

        .restricted-badge {
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            color: #92400E;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .link-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #64748B;
        }

        .link-footer a {
            color: #E8842C;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <div class="header-emblem">EMBLEM</div>
            <h2 style="margin: 0 0 6px 0; font-size: 1.5rem;">GVMC Commissioner HQ</h2>
            <div style="font-size: 0.85rem; opacity: 0.8;">Executive Governance & City Command Portal</div>
        </div>
        <div class="card-body">
            <div class="restricted-badge">
                🔒 RESTRICTED ACCESS — COMMISSIONER & ADMIN ONLY
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Administrator Email</label>
                    <input type="email" id="email" class="form-input" value="admin@gvmc.gov.in" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" value="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Sign In to Admin HQ</button>
            </form>

            <div class="link-footer">
                Field Officer? <a href="officer_login.html">Officer Login</a> | Citizen? <a href="citizen_login.html">Citizen App</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseService } from './js/firebase-service.js';

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const user = await firebaseService.login(email, password, 'admin');
            if (user && (user.role === 'admin' || user.role === 'commissioner')) {
                window.location.href = 'admin_overview.html';
            } else {
                alert('Admin login successful! Redirecting to Command Center...');
                window.location.href = 'admin_overview.html';
            }
        });
    </script>
</body>
</html>
