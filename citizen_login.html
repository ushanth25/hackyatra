<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVMC Road Watch - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1F3A5F;
            --accent: #E8842C;
            --background: #FFFFFF;
            --light-grey: #F4F6F8;
            --on-surface: #1A2530;
            --on-primary: #FFFFFF;
            --on-background: #1A2530;
            --error: #C0392B;
            --success: #2E8B57;
            --border-radius: 0.25rem;
            --spacing-base: 4px;
            --spacing-gutter: 16px;
            --font-noto: 'Noto Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-noto);
            background-color: var(--background);
            color: var(--on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .login-container {
            text-align: center;
            padding: var(--spacing-gutter);
            max-width: 90%;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            border: 2px solid var(--primary);
            border-radius: var(--border-radius);
            margin: 0 auto var(--spacing-gutter);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
        }

        .app-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 var(--spacing-base) 0;
        }

        .app-subtitle {
            font-size: 1.125rem;
            font-weight: 400;
            color: var(--on-surface);
            margin: 0 0 var(--spacing-gutter) 0;
            line-height: 1.5;
        }

        .field {
            text-align: left;
            width: 100%;
            margin: 0 0 var(--spacing-base) 0;
        }

        .label {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--on-surface);
            margin-bottom: var(--spacing-base);
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-input-color);
            border-radius: var(--border-radius);
            background-color: var(--background);
            font-size: 1rem;
            color: var(--on-surface);
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(31, 58, 95, 0.2);
        }

        .create-link {
            margin-top: var(--spacing-base);
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .create-link:hover {
            text-decoration: underline;
        }

        .error-state {
            color: var(--error);
            margin-top: var(--spacing-base);
        }

        /* Style the button like the design system */
        .btn {
            background-color: var(--accent);
            color: var(--on-primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: var(--spacing-base);
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #d47325;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-placeholder">Emblem</div>
        <h1 class="app-title">GVMC Road Watch</h1>
        <p class="app-subtitle">Citizen Login</p>

        <form class="login-form" onsubmit="event.preventDefault();">
            <!-- Email Field -->
            <div class="field">
                <label class="label" for="email">Email Address</label>
                <input class="input-field" id="email" type="email" placeholder="citizen@example.com" required>
            </div>

            <!-- Password Field -->
            <div class="field">
                <label class="label" for="password">Password</label>
                <input class="input-field" id="password" type="password" placeholder="••••••••" required>
            </div>

            <!-- Forgot password -->
            <div class="field">
                <a href="#" class="create-link">Forgot Password?</a>
            </div>

            <!-- Sign In Button -->
            <button class="btn" type="submit">Sign In</button>
        </form>

        <!-- Create Account Link -->
        <p class="create-account" style="margin-top: var(--spacing-gutter); color: var(--on-surface); font-weight: 500;">
            New citizen?
            <a href="#" class="create-link" style="color: var(--accent);">Register</a>
        </p>
    </div>

    <script>
        // Simple client-side validation for demo
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }

            // In real implementation: authenticate with Firebase Auth
            alert('Sign in with email: ' + email + '\nPassword: ' + password);
            // In real app: navigate to Home screen
            // window.location.href = 'home.html';
        });
    </script>
</body>
</html>
