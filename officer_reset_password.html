<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVMC Road Watch - Officer Password Activation</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
        :root {
            --primary: #1F3A5F;
            --accent: #E8842C;
            --background: #F4F6F8;
            --on-surface: #1A2530;
            --border-radius: 6px;
            --font-noto: 'Noto Sans', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-noto);
            background-color: var(--background);
            color: var(--on-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            overflow: hidden;
        }

        .auth-header {
            background-color: var(--primary);
            color: #FFFFFF;
            padding: 24px;
            text-align: center;
        }
        .emblem-box {
            width: 48px;
            height: 48px;
            border: 1px solid #FFF;
            border-radius: 4px;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .auth-header h2 {
            margin: 0 0 6px 0;
            font-size: 1.25rem;
        }
        .auth-header p {
            margin: 0;
            font-size: 0.8rem;
            opacity: 0.85;
        }

        .auth-body {
            padding: 24px;
        }

        .notice-box {
            background: #EFF6FF;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #1E40AF;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #FFF;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #162B47;
        }

        .auth-footer {
            padding: 16px;
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
            text-align: center;
            font-size: 0.8rem;
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="emblem-box">EMBLEM</div>
            <h2>GVMC Roads & Buildings</h2>
            <p>Officer Portal Account Activation</p>
        </div>

        <div class="auth-body">
            <div class="notice-box">
                <strong>Provisioned Account:</strong> Enter your government email and assigned temporary activation token to set your secure password.
            </div>

            <form onsubmit="handleReset(event)">
                <div class="form-group">
                    <label>Official Govt Email</label>
                    <input type="email" class="form-control" value="officer.ward52@gvmc.gov.in" required>
                </div>

                <div class="form-group">
                    <label>Activation Token / Temporary Password</label>
                    <input type="text" class="form-control" value="GVMC-ACT-88291" required>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" class="form-control" placeholder="Minimum 8 characters" required>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" class="form-control" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn-submit">Activate & Set Password</button>
            </form>
        </div>

        <div class="auth-footer">
            Return to <a href="officer_login.html">Officer Portal Login</a>
        </div>
    </div>

    <script>
        function handleReset(e) {
            e.preventDefault();
            alert('Password updated successfully! Redirecting to Officer Portal...');
            window.location.href = 'officer_overview.html';
        }
    </script>
</body>
</html>
