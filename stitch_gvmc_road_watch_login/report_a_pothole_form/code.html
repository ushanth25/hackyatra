                    "secondary-fixed-dim": "#ffb782",
                    "surface-bright": "#f6f9ff",

                    "surface-dim": "#d6dae0",
                    "secondary-container": "#fc943b",

                    "tertiary": "#222425",

                    "on-background": "#171c20",
                    "secondary-fixed": "#ffdcc5",

                    "on-secondary": "#ffffff",

            },
            "borderRadius": {
                    "DEFAULT": "2px",

                    "xl": "8px",
                    "full": "9999px"

            "spacing": {

            "fontFamily": {

                    "label-md": ["Noto Sans"],
                    "headline-lg-mobile": ["Noto Sans"],

            }
          },
        },
      }

<style>
        body { font-family: 'Noto Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .severity-active {
            border-width: 2px !important;
            border-color: #1F3A5F !important;
            background-color: #e5e8ee !important;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex items-center px-4 h-16 bg-primary-container text-on-primary">
<button aria-label="Back" class="mr-4 active:scale-90 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold">Report a Pothole</h1>
</header>
<main class="flex-1 mt-16 mb-24 overflow-y-auto">
<!-- Map Preview Section -->
<section class="relative h-48 w-full bg-surface-variant overflow-hidden">
<img class="w-full h-full object-cover grayscale-[20%] opacity-80" data-alt="A clean, flat-design satellite map view of a city street intersection in Visakhapatnam, India. The aesthetic is official and technical, featuring sharp street lines and clear labeling in a light-mode color scheme. A large, prominent red location pin is centered on the map, casting no shadow. The lighting is bright and even, reinforcing a professional government tool aesthetic with a high-key, functional mood." data-location="Visakhapatnam, India" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8aviR3LCJFKhFCtuc4dR-_r33qh9qNay0bED-xvK9Z4FOBtT61V_FLxg6vdNIaB_P9Z5KltrN-A0hJoKR6cNuXOJl1m1P_lM1-J3R_ADWSYCYSOy-4VHfYFyUvlz8IEssCcmTqPzM4FOU_qPyj5UnCXkCbRMlOGtCKqYlRwu7PcOViGUO3eWec7AmeKA2gQEnumbEBxwjxS9E0vLtt6kCkdANwvH3p9PUc58h7Qj9NyhBS_tDWm9z">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-error text-5xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-on-surface/80 text-surface px-3 py-1 rounded-full text-xs font-label-sm whitespace-nowrap">
                Location auto-filled from GPS — drag pin to adjust.
            </div>
</section>
<!-- Form Content -->
<div class="p-margin-mobile space-y-6">
<!-- Photo Upload Tile -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface">Pothole Photo</label>
<button class="w-full h-32 border-2 border-dashed border-outline rounded-lg flex flex-col items-center justify-center space-y-2 hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-primary text-4xl">add_a_photo</span>
<span class="font-label-md text-label-md text-primary">Add Photo</span>
</button>
</div>
<!-- Severity Selector -->
<div class="space-y-3">
<label class="block font-label-md text-label-md text-on-surface">Severity Level</label>
<div class="grid grid-cols-3 gap-3" id="severity-container">
<button class="severity-pill border border-outline py-3 rounded-full font-label-md text-label-md text-on-surface-variant bg-white transition-all" onclick="selectSeverity(this)">
                        Minor
                    </button>
<button class="severity-pill border border-outline py-3 rounded-full font-label-md text-label-md text-on-surface-variant bg-white transition-all" onclick="selectSeverity(this)">
                        Moderate
                    </button>
<button class="severity-pill border border-outline py-3 rounded-full font-label-md text-label-md text-on-surface-variant bg-white transition-all" onclick="selectSeverity(this)">
                        Severe
                    </button>
</div>
</div>
<!-- Description Text Box -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="description">Description (Optional)</label>
<textarea class="w-full px-4 py-3 border border-outline rounded-lg bg-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md placeholder:text-on-surface-variant/50 transition-all" id="description" placeholder="Provide details about the location or size..." rows="4"></textarea>
</div>
<!-- Policy Footer Note -->
<p class="text-on-surface-variant text-xs font-label-sm leading-relaxed px-1">
                By submitting this report, you confirm the information is accurate to the best of your knowledge. GVMC officials will review and prioritize based on severity.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 w-full p-4 bg-surface-container-lowest border-t border-outline-variant z-50">
<button class="w-full bg-[#E8842C] text-white py-4 font-headline-sm text-headline-sm rounded-lg active:scale-95 transition-all flex items-center justify-center space-x-2" id="submitBtn">
<span>Submit Report</span>
<span class="material-symbols-outlined">send</span>
</button>
</footer>
<script>
        // Severity Selection Logic
        function selectSeverity(element) {
            // Remove active class from all pills
            const pills = document.querySelectorAll('.severity-pill');
            pills.forEach(pill => {
                pill.classList.remove('severity-active', 'font-bold', 'text-primary');
                pill.classList.add('text-on-surface-variant');
            });
            
            // Add active class to clicked pill
            element.classList.add('severity-active', 'font-bold', 'text-primary');
            element.classList.remove('text-on-surface-variant');
        }

        // Micro-interaction for submit
        document.getElementById('submitBtn').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Processing...</span>';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Report Submitted</span>';
                btn.classList.remove('bg-[#E8842C]');
                btn.classList.add('bg-green-700');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-green-700', 'opacity-80', 'pointer-events-none');
                    btn.classList.add('bg-[#E8842C]');
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
