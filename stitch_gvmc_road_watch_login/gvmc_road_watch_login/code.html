<style>
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #f6f9ff;
            color: #171c20;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface flex flex-col min-h-screen">
<!-- Top Bar: Shared Component Logic Applied -->
<header class="fixed top-0 w-full z-50 h-16 bg-primary-container flex items-center px-4">
<div class="flex items-center gap-3 w-full">
<span class="material-symbols-outlined text-on-primary text-2xl" data-icon="account_balance">account_balance</span>
<span class="text-on-primary font-label-md text-label-md leading-tight max-w-[240px]">
                Greater Visakhapatnam Municipal Corporation
            </span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-16">
<div class="w-full max-w-sm flex flex-col items-center text-center">
<!-- App Branding Section -->
<div class="mb-8">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary mb-2">
                    GVMC Road Watch
                </h1>
<p class="text-body-md font-body-md text-on-surface-variant">
                    Report and track road potholes in your ward
                </p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="text-left">
<label class="block text-label-md font-label-md text-on-surface mb-2" for="email">
                        Email Address
                    </label>
<input class="w-full border border-outline-variant bg-surface-container-lowest p-input-padding rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-on-tertiary-container" id="email" placeholder="citizen@example.com" type="email">
</div>
<div class="text-left">
<label class="block text-label-md font-label-md text-on-surface mb-2" for="password">
                        Password
                    </label>
<input class="w-full border border-outline-variant bg-surface-container-lowest p-input-padding rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-on-tertiary-container" id="password" placeholder="••••••••" type="password">
</div>
<!-- Primary Action: Saffron #E8842C mapped to secondary-container intent or custom hex as per guidance -->
<button class="w-full bg-[#E8842C] text-on-primary font-label-md text-label-md py-4 rounded hover:brightness-95 active:scale-[0.98] transition-all uppercase tracking-wide" style="background-color: #E8842C;" type="submit">
                    Sign In
                </button>
</form>
<!-- Secondary Action -->
<div class="mt-8 flex flex-col items-center gap-4">
<a class="text-on-primary-fixed-variant text-label-md font-label-md hover:underline" href="#">
                    Forgot Password?
                </a>
<p class="text-body-md font-body-md text-on-surface-variant">
                    New citizen? 
                    <a class="text-secondary font-semibold hover:underline" href="#">
                        Register
                    </a>
</p>
</div>
</div>
</main>
<!-- Visual Anchor: Map Preview (Subtle Flat Background Element) -->
<div class="w-full px-margin-mobile mt-auto mb-12">
<div class="w-full h-32 border border-outline-variant rounded overflow-hidden relative opacity-60">
<div class="w-full h-full bg-cover bg-center" data-alt="A clean, flat vector-style map of a coastal Indian city like Visakhapatnam. The map uses a professional government-style color palette of light grays and blues, showing major roads and municipal boundaries without any labels or text. The lighting is even and flat, avoiding any shadows or 3D effects to maintain the official administrative aesthetic of the GVMC Road Watch application." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAcpwXbKtEhcgOUl6H8xIndUDwqQmNfge8E_IwoctW0B009iLl1U4AKQOuYlD48t500GqprALQtBVLbmaP-rE7DLgQrfgOHMuKDsK3HUYGssXRMlvtRZkDUzQvMGNeuKV1KA5nsmAkZ2AQ63Hn3HqutpyaycVT8SnbviaT-LgrUseQSSsMtWer23HJcMWGi2Ip36yXay4wyPuqD1Punn2v96po2x9rOdYCxnSEGPI5WQPHXFOFmQA6_')"></div>
<div class="absolute inset-0 bg-surface/40 flex items-center justify-center">
<div class="bg-surface border border-outline px-4 py-1 rounded-full text-label-sm font-label-sm text-on-surface-variant">
                    Visakhapatnam Metropolitan Region
                </div>
</div>
</div>
</div>
<!-- Official Footer (Style Guidance: Light Gray #F8F9FA) -->
<footer class="bg-surface-container-low py-6 px-margin-mobile border-t border-outline-variant">
<div class="flex flex-col items-center text-center gap-2">
<div class="flex gap-4">
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contact</a>
</div>
<p class="text-[10px] font-label-sm text-on-tertiary-fixed-variant uppercase tracking-widest mt-2">
                © 2024 Greater Visakhapatnam Municipal Corporation
            </p>
</div>
</footer>
<script>
        // Simple micro-interaction for input focusing
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#032448';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '';
            });
        });
    </script>
</body></html>
